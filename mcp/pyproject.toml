[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-agent"
version = "1.0.0"
description = "Jev AI Agent: MCP server that serves TypeSafe Jev win probabilities, pre-race and live"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0,<5",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.7,<3",
    "typesafe-sdk>=0.7,<1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-agent = "jev_agent.main:run"

[tool.setuptools.packages.find]
include = ["jev_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
